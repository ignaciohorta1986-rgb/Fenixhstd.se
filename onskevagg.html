<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Önskeväggen — Fenix HSTD</title>
  <meta name="description" content="Vad vill du att Fenix Halmstad Idrottsklubb ska göra? Skriv din önskan anonymt på Önskeväggen." />
  <link rel="canonical" href="https://fenixhstd.se/onskevagg.html" />
  <link rel="icon" type="image/png" sizes="64x64" href="images/site/favicon-64.png" />
  <link rel="apple-touch-icon" href="images/site/apple-touch-icon.png" />
  <meta name="theme-color" content="#0c1022" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://fenixhstd.se/onskevagg.html" />
  <meta property="og:title" content="Önskeväggen — vad vill du att Fenix ska göra?" />
  <meta property="og:description" content="Skriv din önskan anonymt. Fenix Halmstad Idrottsklubb läser allt." />
  <meta property="og:image" content="https://fenixhstd.se/images/site/og-delningsbild.jpg" />
  <meta name="robots" content="index, follow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --navy: #0c1022; --ink: #0c1022; --muted: #3a4566; --line: #d7dcea; --fire: #ff4500; --gold: #ffd60a; --blue: #0055ff;
      --grad: linear-gradient(90deg, #ff4500 0%, #ff6b35 45%, #ffd60a 100%); --grad-text: linear-gradient(90deg, #ff4500, #ff6b35 45%, #e0a800); }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; color: var(--ink); background: #fff; -webkit-font-smoothing: antialiased; }
    a { color: var(--blue); }
    :focus-visible { outline: 3px solid var(--fire); outline-offset: 3px; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }

    .top { background: var(--navy); }
    .top-in { max-width: 1100px; margin: 0 auto; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 1.5rem; color: #fff; }
    .brand img { width: 44px; height: 44px; }
    .brand b { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .top nav a { color: #fff; font-weight: 600; text-decoration: none; font-size: .95rem; }
    .top nav a:hover { color: var(--gold); }
    .bar { height: 6px; background: var(--grad); }

    main { max-width: 1100px; margin: 0 auto; padding: 44px 20px 72px; }
    .label { font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: .9rem; letter-spacing: .3em; text-transform: uppercase; color: var(--blue); }
    h1 { font-family: 'Orbitron', sans-serif; font-weight: 900; text-transform: uppercase; font-size: clamp(2.3rem, 6vw, 4.6rem); line-height: 1.02; margin: 0 0 24px; }
    h1 .f { background: var(--grad-text); -webkit-background-clip: text; background-clip: text; color: transparent; }

    .grid { display: grid; grid-template-columns: 1fr 340px; gap: 40px; align-items: start; }
    .steps { list-style: none; display: grid; gap: 14px; margin-bottom: 28px; }
    .steps li { display: flex; align-items: center; gap: 16px; font-weight: 700; font-size: clamp(1.15rem, 2.4vw, 1.6rem); }
    .steps span { flex: none; display: grid; place-items: center; width: 46px; height: 46px; border-radius: 50%; background: var(--navy); color: var(--gold); font-family: 'Orbitron', sans-serif; font-weight: 900; }

    form { border: 3px solid var(--navy); border-radius: 14px; padding: 18px; background: #fff; }
    label { display: block; font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: .8rem; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin-bottom: 10px; }
    textarea { width: 100%; min-height: 120px; resize: vertical; font: inherit; font-size: 1.1rem; line-height: 1.5; color: var(--ink);
      border: 2px solid var(--line); border-radius: 10px; padding: 14px; background: #f7f8fc; }
    textarea:focus { outline: none; border-color: var(--fire); background: #fff; }
    .foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 12px; }
    .foot small { color: var(--muted); }
    button { font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 1rem; letter-spacing: .1em; text-transform: uppercase; color: #160700;
      background: var(--grad); border: 0; border-radius: 10px; padding: 14px 28px; cursor: pointer; }
    button[disabled] { opacity: .5; cursor: not-allowed; }
    .status { min-height: 1.5em; margin-top: 12px; font-weight: 700; color: #0a7a3d; }
    .status.err { color: #c62828; }

    .qr { border: 3px solid var(--navy); border-radius: 14px; padding: 18px; text-align: center; }
    .qr img { width: 100%; max-width: 280px; height: auto; image-rendering: pixelated; display: block; margin: 0 auto 10px; }
    .qr strong { display: block; font-family: 'Orbitron', sans-serif; font-weight: 900; text-transform: uppercase; font-size: 1rem; }
    .qr small { color: var(--muted); }

    .wall { margin-top: 52px; }
    .wall-head { display: flex; justify-content: space-between; align-items: baseline; border-bottom: 3px solid var(--navy); padding-bottom: 10px; margin-bottom: 16px; }
    .wall-head h2 { font-family: 'Orbitron', sans-serif; font-weight: 900; text-transform: uppercase; font-size: 1.3rem; }
    .wall-head span { font-family: 'Orbitron', sans-serif; font-weight: 900; color: var(--fire); }
    .feed { list-style: none; display: grid; gap: 12px; }
    .comment { display: grid; grid-template-columns: 44px 1fr; gap: 14px; padding: 14px 16px; border: 2px solid var(--line); border-radius: 12px; background: #fff; }
    .comment .av { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--av, var(--grad)); color: #160700; font-family: 'Orbitron', sans-serif; font-weight: 900; }
    .comment .meta { display: flex; gap: 10px; align-items: baseline; margin-bottom: 2px; }
    .comment .who { font-weight: 700; }
    .comment time { color: var(--muted); font-size: .85rem; }
    .comment p { font-size: 1.05rem; overflow-wrap: anywhere; white-space: pre-wrap; }
    .empty { color: var(--muted); padding: 22px; text-align: center; border: 2px dashed var(--line); border-radius: 12px; }

    .join { margin-top: 48px; display: flex; align-items: center; gap: 18px; padding: 18px; border: 3px solid var(--navy); border-radius: 14px; }
    .join img { width: 96px; height: 96px; flex: none; }
    .join div { font-weight: 700; font-size: 1.1rem; }
    .join small { display: block; font-weight: 500; color: var(--muted); margin-top: 4px; }
    .rules { margin-top: 28px; color: var(--muted); font-size: .92rem; }


    /* Datorn = tavlan (bara önskningarna). Mobilen = här skriver man efter att ha skannat. */
    .steps-phone, .phone-only { display: none; }
    .grid { grid-template-columns: 1fr 380px; align-items: center; }
    .steps-board li { font-size: clamp(1.3rem, 2.6vw, 2rem); }
    .steps-board span { width: 56px; height: 56px; font-size: 1.3rem; }
    .qr img { max-width: 320px; }
    @media (max-width: 820px) {
      .grid { grid-template-columns: 1fr; }
      .qr { display: none; }   /* i mobilen är man redan på sidan */
      .steps-board { display: none; }
      .steps-phone { display: grid; }
      .phone-only { display: block; }
      .join img { display: none; }
    }
  </style>
</head>
<body>
  <header class="top">
    <div class="top-in">
      <a href="index.html" class="brand" aria-label="Fenix HSTD, till startsidan"><img src="images/site/fenix-logo-96.png" alt=""><span><b>FENIX</b> HSTD</span></a>
      <nav><a href="index.html">← fenixhstd.se</a></nav>
    </div>
  </header>
  <div class="bar" aria-hidden="true"></div>

  <main id="main">
    <div class="grid">
      <section>
        <h1>Vad vill du<br>att <span class="f">Fenix</span><br>ska göra?</h1>
        <ol class="steps steps-board">
          <li><span>1</span>Skanna koden</li>
          <li><span>2</span>Skriv din önskan</li>
          <li><span>3</span>Helt anonymt</li>
        </ol>
        <form id="wish-form" class="phone-only" novalidate>
          <label for="wish">Din önskan</label>
          <textarea id="wish" name="wish" maxlength="280" required placeholder="Spel, turneringar eller något helt nytt?"></textarea>
          <div class="foot">
            <small><span id="count">0</span>/280 · Skriv inga namn eller telefonnummer</small>
            <button type="submit" id="send">Skicka</button>
          </div>
          <p class="status" id="status" role="status" aria-live="polite"></p>
        </form>
      </section>

      <aside class="qr">
        <img src="images/site/qr-onskevagg.png" width="280" height="280" alt="QR-kod till fenixhstd.se/onskevagg.html">
        <strong>Skanna med mobilen</strong>
      </aside>
    </div>

    <section class="wall" aria-labelledby="feed-title">
      <div class="wall-head"><h2 id="feed-title">Önskningar</h2><span id="feed-count"></span></div>
      <ul class="feed" id="feed"><li class="empty">Väggen laddas …</li></ul>
    </section>
  </main>

  <script src="onskevagg.js"></script>
  <script>
  const form = document.getElementById('wish-form');
  const wish = document.getElementById('wish');
  const count = document.getElementById('count');
  const statusEl = document.getElementById('status');
  const send = document.getElementById('send');
  const feed = document.getElementById('feed');
  const feedCount = document.getElementById('feed-count');

  wish.addEventListener('input', () => { count.textContent = wish.value.length; });
  const setStatus = (msg, err = false) => { statusEl.textContent = msg; statusEl.classList.toggle('err', err); };

  form.addEventListener('submit', async e => {
    e.preventDefault();
    const text = wish.value.trim();
    if (text.length < 2) { setStatus('Skriv din önskan först.', true); wish.focus(); return; }
    send.disabled = true;
    try {
      await owSend(text);
      wish.value = ''; count.textContent = '0';
      setStatus('Tack! Din önskan syns på väggen när Fenix har läst den.');
    } catch (err) {
      setStatus('Det gick inte att skicka. Försök igen om en stund.', true);
    } finally {
      send.disabled = false;
    }
  });

  function render(items) {
    feed.innerHTML = '';
    if (!items || !items.length) { feed.innerHTML = '<li class="empty">Inga önskningar än. Bli den första!</li>'; feedCount.textContent = ''; return; }
    feedCount.textContent = `${items.length} st`;
    items.forEach((it, i) => feed.append(owComment(it, i)));
  }
  async function loadWall() {
    try { render(await owLoadApproved()); }
    catch { feed.innerHTML = '<li class="empty">Väggen kunde inte laddas just nu.</li>'; }
  }
  loadWall();
  setInterval(loadWall, 60000);
  </script>
</body>
</html>
